<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cormorant;font-weight:600;src:url(../../fonts/cormorant-latin-600-normal.woff2)}
@font-face{font-family:Cormorant;font-weight:500;src:url(../../fonts/cormorant-latin-500-normal.woff2)}
@font-face{font-family:Jost;font-weight:400;src:url(../../fonts/jost-latin-400-normal.woff2)}
@font-face{font-family:Jost;font-weight:500;src:url(../../fonts/jost-latin-500-normal.woff2)}
@font-face{font-family:Jost;font-weight:600;src:url(../../fonts/jost-latin-600-normal.woff2)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505;color:#fff;font-family:Jost,sans-serif}
.abs{position:absolute}
#bg{inset:-120px;background:radial-gradient(ellipse 78% 52% at 50% 52%,#4d3910 0%,#1f170a 46%,#090909 78%)}
#glow2{left:-300px;top:-200px;width:1100px;height:1100px;background:radial-gradient(circle,rgba(212,175,55,.16),rgba(212,175,55,0) 62%)}
#rays{left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
 background:repeating-conic-gradient(from 0deg,rgba(212,175,55,.10) 0 5deg,transparent 5deg 15deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%)}
.bk{border-radius:50%;background:radial-gradient(circle,rgba(236,208,128,.75),rgba(236,208,128,0) 68%)}
#vig{inset:0;background:radial-gradient(ellipse 95% 80% at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.78) 100%)}
#grain{left:-60px;top:-60px;width:1200px;height:2040px;opacity:.035;image-rendering:pixelated}
#flash{inset:0;background:#fff;opacity:0}
.line{overflow:hidden;white-space:nowrap}
.line>span{display:inline-block;will-change:transform}
.eyebrow{font:500 30px/1 Jost;letter-spacing:9px;color:#e6c875;text-transform:uppercase}
.title{font:600 96px/1.05 Cormorant,serif;letter-spacing:1px}
.sub{font:400 36px/1.25 Jost;color:#e2e2e2;letter-spacing:1px}
.rule{height:2px;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
.price{font:600 120px/1 Cormorant,serif;color:#f1d98a;letter-spacing:2px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.chips{font:500 31px/1 Jost;letter-spacing:2px;color:#f3f3f3}
.cta{height:104px;padding:0 60px;border-radius:52px;background:#d4af37;color:#111;display:flex;align-items:center;gap:20px;font:600 36px/1 Jost;letter-spacing:3.5px;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.cta svg{width:54px;height:54px}
.prod{will-change:transform,filter}
.card{background-size:cover;background-position:center;border:6px solid #d4af37;border-radius:4px;box-shadow:0 34px 60px rgba(0,0,0,.65),0 0 70px rgba(212,175,55,.22)}
.count{font:500 30px/1 Jost;letter-spacing:6px;color:#e6c875}
.center{left:0;right:0;text-align:center}
</style></head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div id="glow2" class="abs"></div>
  <div id="rays" class="abs"></div>
  <div id="bokehs"></div>
  <div id="content" class="abs" style="inset:0"></div>
  <div id="endcard" class="abs" style="inset:0;opacity:0"></div>
  <div id="vig" class="abs"></div>
  <canvas id="grain" class="abs" width="600" height="1020"></canvas>
  <div id="flash" class="abs"></div>
</div>
<script src="scene.js"></script>
</body></html>
