<!doctype html><html><head><meta charset="utf-8"><title>Anjum Mart social art</title>
<style>
@font-face{font-family:'Cormorant';font-weight:600;src:url(../marketing/fonts/cormorant-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant';font-weight:500;src:url(../marketing/fonts/cormorant-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Jost';font-weight:500;src:url(../marketing/fonts/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Jost';font-weight:400;src:url(../marketing/fonts/jost-latin-400-normal.woff2) format('woff2')}
body{margin:0;background:#444}
#cover{position:relative;width:1640px;height:624px;overflow:hidden;background:
  radial-gradient(ellipse 60% 90% at 30% 50%,rgba(212,175,55,.20),transparent 70%),#111;font-family:'Jost',sans-serif}
#cover .f1{position:absolute;inset:22px;border:2px solid #d4af37}
#cover .f2{position:absolute;inset:34px;border:1px solid rgba(212,175,55,.45)}
#cover .block{position:absolute;left:0;right:0;top:0;height:624px;display:flex;align-items:center;justify-content:center;gap:44px}
#cover img{height:272px;width:auto;display:block}
#cover .rule{width:2px;height:200px;background:linear-gradient(#d4af37,rgba(212,175,55,.2))}
#cover h1{margin:0;font-family:'Cormorant',serif;font-weight:600;font-size:54px;line-height:1.05;color:#fff;letter-spacing:.3px;white-space:nowrap}
#cover .l2{margin-top:14px;font-weight:500;font-size:22px;letter-spacing:4px;color:#d4af37;white-space:nowrap}
#cover .l3{margin-top:10px;font-size:20px;letter-spacing:2.5px;color:#d9d4c7;white-space:nowrap}
.hl{position:relative;width:1080px;height:1920px;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Cormorant',serif;overflow:hidden}
.hl .ring{position:absolute;width:760px;height:760px;border-radius:50%;border:6px solid #d4af37;box-shadow:0 0 0 22px #111,0 0 0 24px rgba(212,175,55,.35)}
.hl .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:36px;color:#fff;text-align:center}
.hl svg{width:230px;height:230px;fill:none;stroke:#d4af37;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.hl .t{font-weight:600;font-size:92px;letter-spacing:8px;text-transform:uppercase}
.hl .big{font-weight:600;font-size:200px;letter-spacing:6px;color:#d4af37;line-height:1}
.hl .s{font-family:'Jost',sans-serif;font-weight:500;font-size:30px;letter-spacing:4px;color:#d9d4c7;margin-top:-14px}
</style></head><body>
<div id="cover"><div class="f1"></div><div class="f2"></div>
  <div class="block"><img src="../brand/editable/anjum-mart-logo-for-dark-background.svg" alt=""><div class="rule"></div>

 <div class="t">Ladies</div><div class="s">WATCHES</div></div></div>

 <div class="t" style="font-size:78px">Replacement</div><div class="s">DAMAGED OR WRONG ITEM<br>REPORT WITHIN 48 HOURS</div></div></div>
</body></html>
